# Import environment variables
spring.config.import=optional:file:.env[.properties]

# Application
spring.application.name=music-radio-backend
server.port=8080

# PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# JWT Configuration
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
jwt.cookie-name=access_token
jwt.cookie-secure=${JWT_COOKIE_SECURE:false}
jwt.cookie-same-site=Lax

# CORS Configuration
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:3000}

# Default Admin Initializer
app.admin.default-email=${ADMIN_DEFAULT_EMAIL:admin@musicradio.local}
app.admin.default-password=${ADMIN_DEFAULT_PASSWORD:Admin@123456}
app.admin.default-name=${ADMIN_DEFAULT_NAME:System Administrator}
